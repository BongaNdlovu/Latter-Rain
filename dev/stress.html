<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Rain of the Word — Stress Tests</title>
<style>
:root{--gold:#ffd98a;--amber:#ffb347;--cy:#5ff2e6;--mg:#ff4fa3;--ink:#f3f6ff;--glass:rgba(9,10,30,.6);--edge:rgba(255,217,138,.3)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#04040f;overflow:hidden;color:var(--ink);font-family:Georgia,"Times New Roman",serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;transition:filter .3s;pointer-events:none}
#fx{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
#verse,#sc,#hearts,#lvl,#rev,#pows,#hint,#foc{background:var(--glass);border:1px solid var(--edge);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 28px rgba(255,217,138,.05);pointer-events:none;transition:opacity .18s}
#verse{position:fixed;top:calc(env(safe-area-inset-top,0px) + 4.6vh);left:50%;transform:translateX(-50%);width:min(60vw,780px);text-align:center;font-size:clamp(19px,2.9vw,31px);line-height:1.5;padding:14px 26px 12px;border-radius:20px;text-shadow:0 1px 8px #000}
#verse small{display:inline-block;margin-top:8px;padding:2px 14px;font-size:.42em;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(255,217,138,.4);border-radius:99px}
#verse:empty{display:none}
.b{display:inline-block;min-width:3.4em;margin:0 .1em;border-bottom:3px solid var(--cy);box-shadow:0 9px 14px -9px var(--cy);color:transparent;animation:pl 1.6s ease-in-out infinite}
.b.f{color:var(--gold);border-color:var(--gold);box-shadow:0 9px 16px -9px var(--amber);text-shadow:0 0 18px rgba(255,179,71,.85);animation:none}
.b.m{border-color:#ff6a6a;box-shadow:0 9px 14px -9px #ff4f4f;animation:shk .55s}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pl{50%{opacity:.45}}
@keyframes pop{0%{transform:scale(1.6);opacity:0}60%{transform:scale(.94)}100%{transform:scale(1);opacity:1}}
#sc{position:fixed;top:calc(env(safe-area-inset-top,0px) + 4.6vh);left:18px;display:flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
#sc .lab{opacity:.65}
#sc b{color:var(--gold);font-size:24px;font-weight:400;letter-spacing:0;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,179,71,.5)}
#stt em{font-style:normal;opacity:.55}
.stk{font-style:normal;margin-right:8px;padding:3px 10px;border-radius:99px;background:linear-gradient(90deg,var(--mg),var(--amber));color:#10091f;font-weight:700;animation:pop .35s}
#hearts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 4.6vh);right:18px;display:flex;gap:8px;padding:9px 16px;border-radius:999px}
#hearts svg{width:24px;height:22px;fill:#ff4f7a;filter:drop-shadow(0 0 8px rgba(255,79,122,.8));transition:all .3s}
#hearts .x svg{fill:#3a3d5c;filter:none;transform:scale(.8) rotate(-12deg);opacity:.6}
#hearts.hit{animation:hit .5s}
@keyframes hit{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}}
#lvl{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);padding:9px 18px;border-radius:999px;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
#loc{opacity:.8;margin-right:10px;padding-right:10px;border-right:1px solid rgba(255,255,255,.22);color:var(--cy)}
#wx{opacity:.75;margin-left:0;padding-left:0;transition:opacity .5s}
#bar{width:120px;height:4px;background:#ffffff1f;margin-top:7px;border-radius:2px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--mg),var(--gold));transition:width .6s}
#foc{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 6vh + 62px);padding:8px 18px;border-radius:999px;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
#foc .lab{opacity:.65}
#fbar{width:86px;height:4px;background:#ffffff1f;margin-top:6px;border-radius:2px;overflow:hidden}
#fbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--cy),#8a7bff);box-shadow:0 0 8px rgba(95,242,230,.7);transition:width .15s}
#rev{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);width:min(82vw,720px);padding:22px 30px;border-radius:22px;text-align:center;font-size:clamp(21px,4vw,36px);color:var(--gold);text-shadow:0 0 26px #ffb347,0 2px 10px #000;opacity:0;transition:opacity .45s;line-height:1.4}
#rev small{display:block;font-size:.4em;opacity:.75;margin-top:10px;letter-spacing:.2em;text-transform:uppercase}
#pows{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 6vh + 108px);display:flex;flex-direction:column;gap:8px;align-items:flex-end;border:0;box-shadow:none;background:none;border-radius:0}
.pw{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:99px;background:var(--glass);border:1px solid var(--edge);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-family:inherit;animation:pop .35s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18vh);transform:translateX(-50%);max-width:88vw;border-radius:16px;padding:10px 20px;font-size:14px;line-height:1.5;opacity:0;transition:opacity .5s;text-align:center;z-index:6}
#warn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 13vh);left:50%;transform:translateX(-50%);display:none;padding:10px 24px;border-radius:16px;background:rgba(46,8,12,.78);border:1px solid rgba(255,110,80,.6);color:#ffc2ae;font-size:clamp(13px,1.9vw,18px);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 6px #000;box-shadow:0 8px 34px rgba(255,70,40,.28),inset 0 0 22px rgba(255,90,60,.08);z-index:6;pointer-events:none}
#warn.show{display:block;animation:warnin .5s}
@keyframes warnin{from{opacity:0;transform:translate(-50%,-12px)}}
#trans{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .45s;pointer-events:none;z-index:7}
#trans.show{opacity:1}
#trans em{display:block;font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--cy);opacity:.8;font-style:normal;margin-bottom:10px}
#trans b{display:block;font-size:clamp(28px,5.4vw,54px);font-weight:400;letter-spacing:.08em;background:linear-gradient(180deg,#fff,#ffd98a 60%,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(124,92,255,.55))}
#trans i{display:block;width:150px;height:2px;margin:12px auto 0;background:linear-gradient(90deg,rgba(95,242,230,0),rgba(95,242,230,.9),rgba(138,123,255,.9),rgba(138,123,255,0));box-shadow:0 0 12px rgba(95,242,230,.6)}
#trans small{display:block;margin-top:12px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);opacity:.65}
#ctl{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 6vh);display:flex;flex-direction:column;gap:10px;z-index:7;transition:opacity .18s}
button.c{width:42px;height:42px;padding:0;margin:0;font-size:15px;font-weight:400;letter-spacing:0;border-radius:50%;background:var(--glass);color:var(--gold);border:1px solid var(--edge);box-shadow:0 4px 14px rgba(0,0,0,.4);backdrop-filter:blur(4px)}
button.c:hover{transform:translateY(-1px)}
#pz{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:rgba(3,3,12,.78);backdrop-filter:blur(6px);z-index:9;padding:24px;transition:opacity .18s}
#pz h2{font-size:clamp(30px,6vw,52px);margin:0;font-weight:400;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 24px rgba(255,179,71,.4)}
#pz p{margin:0;font-size:12px;opacity:.55;letter-spacing:.1em;text-transform:uppercase}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,rgba(40,24,90,.55),rgba(3,3,12,.9));padding:24px;gap:14px;z-index:8;overflow-y:auto}
#ov h1{font-size:clamp(38px,8vw,76px);margin:0;font-weight:400;letter-spacing:.04em;background:linear-gradient(180deg,#fff,#ffd98a 55%,#ff9d5c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(255,150,90,.35))}
#ov p{margin:0;max-width:560px;opacity:.85;line-height:1.6;font-size:clamp(14px,1.6vw,17px)}
#ov .v{font-size:clamp(17px,2.8vw,25px);color:var(--gold);opacity:0;animation:fi 2.2s .3s forwards;line-height:1.45;padding:16px 26px;border:1px solid var(--edge);border-radius:18px;background:var(--glass);max-width:640px}
@keyframes fi{to{opacity:1}}
#coll{max-width:660px;width:100%;background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:10px 16px}
#coll b{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:400}
#locs,#bds{max-width:660px;width:100%;background:var(--glass);border:1px solid var(--edge);border-radius:14px;padding:10px 16px}
#locs b,#bds b{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--cy);font-weight:400}
.cvs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;justify-content:center}
.cv{font-size:10px;letter-spacing:.08em;padding:3px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.14);opacity:.4}
.cv.on{color:var(--gold);border-color:rgba(255,217,138,.5);opacity:1;text-shadow:0 0 8px rgba(255,179,71,.6)}
.cv.lc{color:#9fe8ff;border-color:rgba(127,232,255,.35);opacity:.85}
button{font:inherit;font-size:18px;font-weight:700;letter-spacing:.06em;color:#120a1c;background:linear-gradient(180deg,#ffe7a3,#ffb347);border:0;border-radius:999px;padding:14px 44px;cursor:pointer;margin-top:8px;box-shadow:0 0 34px rgba(255,179,71,.45),0 6px 0 #b8741c;transition:transform .15s}
button:hover{transform:translateY(-2px)}button:active{transform:translateY(4px);box-shadow:0 0 24px rgba(255,179,71,.4),0 2px 0 #b8741c}
button.ghost{background:transparent;color:var(--gold);border:1px solid var(--edge);box-shadow:0 0 18px rgba(255,217,138,.12),0 4px 0 rgba(255,217,138,.15)}
button.db{font-size:15px;padding:10px 20px;margin:0;text-transform:uppercase;letter-spacing:.12em;background:var(--glass);color:var(--ink);border:1px solid var(--edge);box-shadow:0 4px 16px rgba(0,0,0,.35)}
button.db small{display:block;font-size:10px;letter-spacing:.14em;opacity:.75;margin-top:3px;font-weight:400}
button.db.on{background:linear-gradient(180deg,#ffe7a3,#ffb347);color:#120a1c;border-color:transparent;box-shadow:0 0 26px rgba(255,179,71,.45),0 4px 0 #b8741c}
button.db.on small{opacity:.85}
button.db:disabled{opacity:.45;cursor:default;transform:none}
/* photo mode: hide all UI */
body.photo #verse,body.photo #sc,body.photo #hearts,body.photo #lvl,body.photo #rev,
body.photo #pows,body.photo #hint,body.photo #ctl,body.photo #pz,body.photo #foc,body.photo #warn,body.photo #trans{opacity:0!important}
@media(max-width:700px){
#verse{width:94vw;top:calc(env(safe-area-inset-top,0px) + 3.8vh);padding:10px 14px 9px}
#sc,#hearts{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh)}
#lvl{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12vh)}
#foc{left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 19vh)}
#ctl{top:50%;bottom:auto;transform:translateY(-50%);right:8px}
#pows{right:auto;left:12px;top:50%;bottom:auto;transform:translateY(-50%);align-items:flex-start}
}
#verse.in{animation:vin .7s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translate(-50%,-14px)}}
.b.f.n{animation:pop .55s cubic-bezier(.2,.9,.3,1.2)}
#verse,#sc,#hearts,#lvl,#rev{will-change:transform}
/* ===== V2 integration: combo meter, banner, rank, trick button, location picker ===== */
/* safe centering: tall menus scroll from their top instead of being clipped above the screen */
#ov{justify-content:flex-start}#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
.db.bd{display:flex;flex-direction:column;align-items:center}
.db .bth{position:static;inset:auto;width:132px;height:56px;margin:-4px 0 2px;pointer-events:none}
.db.lk{opacity:.78}
.bpv{display:flex;flex-direction:column;align-items:center;margin:4px 0 8px}
#bprev{position:static;inset:auto;width:min(440px,86vw);height:auto;max-height:130px;border:1px solid var(--edge);border-radius:16px;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.07),rgba(0,0,0,.25))}
#bpn{margin-top:6px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
#rkp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 4.6vh + 50px);left:18px;display:flex;flex-direction:column;min-width:96px;padding:5px 14px 6px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);pointer-events:none}
body.photo #rkp{opacity:0}
#lt{margin-right:10px}
@media(max-width:700px){#rkp{top:calc(env(safe-area-inset-top,0px) + 3.8vh + 96px);left:12px}}
#rkp .rank{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--mg);opacity:.9}
#xpbar{width:100%;height:2px;background:rgba(255,255,255,.1);margin-top:4px;border-radius:2px;overflow:hidden}
#xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mg),var(--gold));transition:width .6s}
#combo{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;z-index:6;text-shadow:0 0 20px rgba(255,79,163,.7),0 2px 10px #000;white-space:nowrap}
#combo.show{opacity:1}
#combo .tn{font-size:clamp(13px,1.7vw,18px);letter-spacing:.22em;color:#fff;text-transform:uppercase}
#combo .cm{font-size:clamp(22px,3.4vw,38px);color:var(--gold);font-weight:700;letter-spacing:.06em}
#combo .cm em{font-style:normal;color:var(--mg);font-size:.6em;margin-left:.4em}
#combo.pop{animation:cpop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes cpop{0%{transform:translateX(-50%) scale(1.35)}100%{transform:translateX(-50%) scale(1)}}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);font-size:clamp(26px,5vw,58px);letter-spacing:.14em;text-transform:uppercase;pointer-events:none;opacity:0;z-index:6;text-shadow:0 0 30px currentColor,0 3px 14px #000;white-space:nowrap}
#banner.show{animation:bnr 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%) scale(.96)}}
select.sel{font:inherit;font-size:13px;padding:7px 12px;border-radius:10px;background:rgba(9,10,30,.85);color:var(--ink);border:1px solid var(--edge);max-width:92vw}
body.photo #combo,body.photo #banner{opacity:0!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fx"></div>
<div id="sc"><span class="lab">Score</span><b id="s">0</b><span id="stt"></span></div><div id="rkp" class="rkw"><span class="rank" id="rk"></span><span id="xpbar"><i></i></span></div>
<div id="combo"><div class="tn"></div><div class="cm"></div></div>
<div id="banner"></div>
<div id="verse"></div>
<div id="hearts"></div>
<div id="rev"></div>
<div id="warn"></div>
<div id="trans"><em>Traveling to</em><b id="transLoc">Sea of Galilee</b><i></i><small id="transSub">Level 2 · Storm</small></div>
<div id="lvl"><span id="lt">Level 1</span><span id="loc">Sea of Galilee</span><span id="wx">Storm</span><div id="bar"><i></i></div></div>
<div id="foc"><span class="lab">Focus</span><div id="fbar"><i></i></div></div>
<div id="pows"></div>
<div id="hint"></div>
<div id="ctl"><button class="c" id="jb" title="Jump (W / ↑)">⤒</button><button class="c" id="kb" title="Kickflip (J) · K heel · L shove · hold S manual">✦</button><button class="c" id="pb" title="Pause (P)">⏸</button><button class="c" id="mb" title="Sound (M)">🔊</button><button class="c" id="ob" title="Photo (O)">📷</button></div>
<div id="pz"><h2>Paused</h2><div class="row"><button id="pr">Resume</button><button class="ghost" id="prn">Restart</button><button class="ghost" id="pp">Snapshot</button><button class="ghost" id="pm">Menu</button></div><p>P / Esc resume · Space focus · J/K/L tricks · S manual · O snapshot · M mute</p></div>
<div id="ov"></div>
<script src="../js/data.js"></script>
<script src="../js/core.js"></script>
<script src="../js/fx.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/env.js"></script>
<script src="../js/world.js"></script>
<script src="../js/ground.js"></script>
<script src="../js/weather.js"></script>
<script src="../js/rain.js"></script>
<script src="../js/storm.js"></script>
<script src="../js/disasters.js"></script>
<script src="../js/entities.js"></script>
<script src="../js/board3d.js"></script>
<script src="../js/board.js"></script>
<script src="../js/tricks.js"></script>
<script src="../js/skate.js"></script>
<script src="../js/camera.js"></script>
<script src="../js/main.js"></script>
<script src="../js/journey.js"></script>
<script src="stress.js"></script>
</body>
</html>
